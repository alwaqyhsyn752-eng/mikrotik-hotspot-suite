<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحميل التطبيق</title>
<style>
:root{--bg:#020617;--card:#0b1220;--p:#22d3ee;--text:#e2e8f0;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0%,#0f172a,var(--bg) 70%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid rgba(34,211,238,.3);border-radius:20px;padding:32px;text-align:center;box-shadow:0 0 40px rgba(34,211,238,.12)}
.icon{width:80px;height:80px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(14,165,233,.1));border:1px solid var(--p);display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--p);font-weight:900;box-shadow:0 0 30px rgba(34,211,238,.3)}
h2{margin-bottom:8px;font-size:20px;text-shadow:0 0 12px rgba(34,211,238,.4)}
p{color:var(--muted);font-size:13px;margin-bottom:22px;line-height:1.7}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--p),#0ea5e9);color:#020617;font-weight:800;cursor:pointer;font-size:15px;text-decoration:none;margin-bottom:10px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid rgba(34,211,238,.4);color:var(--p)}
.dev{margin-top:22px;font-size:11px;color:var(--muted);border-top:1px solid rgba(148,163,184,.12);padding-top:14px}
.dev span{color:var(--p)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">A</div>
  <h2>تطبيق الشبكة</h2>
  <p>حمّل تطبيق الإدارة للوصول السريع لشبكتك وإدارة الكروت من هاتفك مباشرة.</p>
  <a class="btn" href="https://github.com/alwaqyhsyn752-eng/mikrotik-hotspot-suite/releases/latest/download/app-release.apk">
    تحميل APK
  </a>
  <a class="btn ghost" href="https://github.com/alwaqyhsyn752-eng/mikrotik-hotspot-suite/actions">
    متابعة البناء
  </a>
  <div class="dev">تصميم وتطوير: <span>حسين العولقي</span> | هاتف: <span>738660998</span></div>
</div>
</body>
</html>
