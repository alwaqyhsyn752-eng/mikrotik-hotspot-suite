<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>استخراج</title><style>body{background:#020617;color:#e2e8f0;font-family:system-ui;padding:20px;margin:0}h2{color:#22d3ee}p{color:#94a3b8;font-size:12px}select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #22d3ee;background:#000;color:#0f0;font-family:monospace;font-size:11px;margin:10px 0;box-sizing:border-box}textarea{height:400px}button{padding:10px 20px;background:#22d3ee;color:#000;border:none;border-radius:8px;font-weight:800;cursor:pointer}a{color:#22d3ee;text-decoration:none;font-size:12px}</style></head><body><a href="../dashboard/index.html">&#8592; القائمة</a><h2>استخراج الكود</h2><p>اختر قالباً، انسخ الكود، ارفعه للميكروتيك.</p><select id="s" onchange="load()"><option>001</option><option>002</option><option>003</option><option>050</option><option>100</option></select><textarea id="o"></textarea><button onclick="navigator.clipboard.writeText(document.getElementById('o').value);alert(1)">نسخ</button><script>function load(){fetch('../templates/tpl_'+document.getElementById('s').value+'.html').then(function(r){return r.text()}).then(function(t){document.getElementById('o').value=t})}load()</script></body></html>
