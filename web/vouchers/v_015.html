<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><style>
    body{background:#020617;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:system-ui;color:#fff;}
    .card{background:#0b1220;padding:20px;width:90%;max-width:350px;text-align:center;border-radius:0 20px 0 20px;}
    .card h2{color:#38bdf8;margin-bottom:10px;}
    .card .code{font-family:monospace;font-size:24px;letter-spacing:3px;font-weight:bold;margin:15px 0;color:#38bdf8;}
    .card .row{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;border-top:1px dashed rgba(148,163,184,0.3);padding:8px 0;}
    .card .dev{font-size:10px;color:#94a3b8;margin-top:15px;}
    </style></head><body><div class="card">
    <h2>شبكة المستقبل</h2>
    <div class="code">ABC-015</div>
    <div class="row"><span>البيانات</span><span>5 GB</span></div>
    <div class="row"><span>الصلاحية</span><span>7 أيام</span></div>
    <div class="row"><span>الهاتف</span><span>738660998</span></div>
    <div class="dev">تصميم وتطوير: حسين العولقي | هاتف: 738660998</div>
    </div></body></html>
