<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>بوابة الدخول | شبكة المستقبل</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0%,#0f172a,#020617 70%);color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.portal{width:100%;max-width:440px;background:linear-gradient(145deg,rgba(15,23,42,.95),rgba(2,6,23,.98));border:1px solid #22d3ee;border-radius:24px;padding:36px 26px 26px;box-shadow:0 0 60px rgba(34,211,238,.2),inset 0 0 40px rgba(34,211,238,.05);backdrop-filter:blur(14px)}
.logo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,#22d3ee,#0891b2);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#020617;box-shadow:0 0 30px #22d3ee;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05);box-shadow:0 0 50px #22d3ee}}
h1{text-align:center;font-size:22px;margin-bottom:6px;text-shadow:0 0 20px #22d3ee}
.sub{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:24px}
input{width:100%;padding:14px 16px;margin-bottom:12px;background:rgba(0,0,0,.5);border:1px solid rgba(148,163,184,.3);border-radius:12px;color:#e2e8f0;font-size:15px;font-family:inherit;outline:none;transition:.3s}
input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.2),0 0 20px rgba(34,211,238,.3)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#0891b2);color:#020617;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 0 25px rgba(34,211,238,.4)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mini{padding:12px 8px;border:1px solid rgba(34,211,238,.4);border-radius:12px;background:transparent;color:#22d3ee;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.mini:hover{background:rgba(34,211,238,.15)}
.dev{margin-top:22px;text-align:center;font-size:11px;color:#94a3b8;border-top:1px solid rgba(148,163,184,.15);padding-top:14px}
.dev span{color:#22d3ee;font-weight:600}
</style>
</head>
<body>
<main class="portal">
<div class="logo">N</div>
<h1>بوابة الشبكة</h1>
<p class="sub">أدخل بيانات الكرت للاتصال</p>
<form id="loginForm">
<div><input type="text" name="username" placeholder="رقم الكرت" required maxlength="64"></div>
<div><input type="password" name="password" placeholder="كلمة المرور" required maxlength="64"></div>
<button type="submit" class="btn">دخول</button>
</form>
<div class="actions">
<button class="mini" onclick="goRoute('inquiry')"><span>&#9906;</span>استعلام</button>
<button class="mini" onclick="goRoute('salafni')"><span>&#9737;</span>سلفني</button>
<button class="mini" onclick="goRoute('app')"><span>&#8681;</span>تحميل التطبيق</button>
<button class="mini" onclick="goRoute('help')"><span>&#63;</span>مساعدة</button>
</div>
<div class="dev">تصميم وتطوير: <span>حسين العولقي</span> | هاتف: <span>738660998</span></div>
</main>
<script>
function goRoute(name){
  var map={inquiry:'/card-inquiry',salafni:'/salafni',app:'/app-download',help:'/help'};
  try{window.location.replace(map[name]||'/');}catch(e){window.location.href=map[name]||'/';}
  return false;
}
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  alert('وضع المعاينة: تم استلام البيانات');
});
</script>
</body>
</html>
