<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>بوابة الدخول | شبكة المستقبل</title>
<style>
:root{
  --bg-deep:#020617;
  --bg-mid:#0b1220;
  --surface:rgba(15,23,42,.92);
  --cyan:#67e8f9;
  --cyan-strong:#22d3ee;
  --cyan-soft:rgba(34,211,238,.15);
  --cyan-border:rgba(34,211,238,.35);
  --text:#e2e8f0;
  --muted:#94a3b8;
  --danger:#f87171;
  --success:#34d399;
  --glow:0 0 18px rgba(34,211,238,.65);
  --glow-soft:0 0 30px rgba(34,211,238,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(circle at 50% 0%, #0f172a 0%, var(--bg-deep) 60%),
    linear-gradient(180deg, #020617 0%, #010409 100%);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(34,211,238,.06), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(34,211,238,.05), transparent 40%);
  pointer-events:none;
  z-index:0;
}
.portal{
  position:relative;
  z-index:1;
  width:100%;
  max-width:440px;
  background:linear-gradient(145deg, var(--surface), rgba(2,6,23,.96));
  border:1px solid var(--cyan-border);
  border-radius:24px;
  padding:34px 26px 26px;
  box-shadow:
    var(--glow-soft),
    inset 0 0 20px rgba(34,211,238,.05),
    0 20px 60px rgba(0,0,0,.5);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  animation:portalIn .6s ease-out;
}
@keyframes portalIn{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
.brand{
  text-align:center;
  margin-bottom:26px;
}
.brand-logo{
  width:64px;
  height:64px;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:linear-gradient(135deg, rgba(34,211,238,.15), rgba(14,165,233,.1));
  border:1px solid var(--cyan-border);
  box-shadow:0 0 24px rgba(34,211,238,.25), inset 0 0 12px rgba(34,211,238,.1);
  font-size:28px;
  color:var(--cyan);
  font-weight:900;
  text-shadow:var(--glow);
}
.brand h1{
  font-size:22px;
  font-weight:800;
  letter-spacing:.5px;
  text-shadow:var(--glow);
  margin-bottom:6px;
}
.brand p{
  font-size:13px;
  color:var(--muted);
  letter-spacing:.3px;
}
.field{
  position:relative;
  margin-bottom:12px;
}
.field input{
  width:100%;
  padding:14px 16px 14px 44px;
  background:rgba(2,6,23,.75);
  border:1px solid rgba(148,163,184,.22);
  border-radius:13px;
  color:var(--text);
  font-size:15px;
  font-family:inherit;
  outline:none;
  transition:border-color .25s, box-shadow .25s, background .25s;
}
.field input::placeholder{color:#64748b}
.field input:focus{
  border-color:var(--cyan-strong);
  background:rgba(2,6,23,.95);
  box-shadow:0 0 0 3px var(--cyan-soft), 0 0 20px rgba(34,211,238,.15);
}
.field .icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  width:20px;
  height:20px;
  color:var(--cyan);
  opacity:.85;
  pointer-events:none;
}
.btn-primary{
  width:100%;
  padding:14px;
  border:none;
  border-radius:13px;
  background:linear-gradient(135deg, var(--cyan-strong), #0ea5e9);
  color:#020617;
  font-weight:800;
  font-size:15px;
  letter-spacing:.4px;
  cursor:pointer;
  font-family:inherit;
  margin-top:8px;
  box-shadow:0 0 24px rgba(34,211,238,.4), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .15s, filter .2s, box-shadow .25s;
}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{transform:scale(.98)}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.btn-ghost{
  padding:12px 8px;
  border:1px solid var(--cyan-border);
  border-radius:12px;
  background:transparent;
  color:var(--cyan);
  font-size:13px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  transition:background .2s, box-shadow .2s, transform .15s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn-ghost:hover{
  background:var(--cyan-soft);
  box-shadow:0 0 16px rgba(34,211,238,.2);
}
.btn-ghost:active{transform:scale(.98)}
.btn-ghost .sym{
  font-size:15px;
  line-height:1;
  text-shadow:var(--glow);
}
.divider{
  margin:22px 0 16px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(148,163,184,.25), transparent);
}
.status{
  display:none;
  padding:11px 14px;
  border-radius:11px;
  font-size:13px;
  font-weight:600;
  text-align:center;
  margin-top:14px;
  border:1px solid;
}
.status.show{display:block;animation:statusIn .3s ease-out}
.status.error{
  background:rgba(248,113,113,.1);
  border-color:rgba(248,113,113,.4);
  color:var(--danger);
}
.status.ok{
  background:rgba(52,211,153,.1);
  border-color:rgba(52,211,153,.4);
  color:var(--success);
}
@keyframes statusIn{
  from{opacity:0;transform:translateY(-6px)}
  to{opacity:1;transform:translateY(0)}
}
.dev-sign{
  margin-top:22px;
  text-align:center;
  font-size:11px;
  color:var(--muted);
  border-top:1px solid rgba(148,163,184,.12);
  padding-top:14px;
  letter-spacing:.4px;
  line-height:1.7;
}
.dev-sign span{color:var(--cyan);font-weight:600}
.dev-sign .sep{margin:0 6px;opacity:.5}
@media (max-width:380px){
  .portal{padding:26px 18px 20px;border-radius:20px}
  .brand h1{font-size:19px}
  .actions{grid-template-columns:1fr}
}
</style>
</head>
<body>

<main class="portal" role="main">

  <div class="brand">
    <div class="brand-logo" aria-hidden="true">N</div>
    <h1>بوابة الشبكة</h1>
    <p>أدخل بيانات الكرت للاتصال بالإنترنت</p>
  </div>

  <form id="loginForm" action="/login" method="post" autocomplete="off" onsubmit="return handleLogin(event)">

    <div class="field">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="M3 10h18"/>
      </svg>
      <input
        type="text"
        name="username"
        id="username"
        placeholder="رقم الكرت / اسم المستخدم"
        required
        maxlength="64"
        inputmode="text"
        autocomplete="off"
        spellcheck="false"
      >
    </div>

    <div class="field">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
      <input
        type="password"
        name="password"
        id="password"
        placeholder="كلمة المرور"
        required
        maxlength="64"
        autocomplete="off"
      >
    </div>

    <button type="submit" class="btn-primary">دخول</button>

    <div class="status" id="statusBox" role="status" aria-live="polite"></div>

  </form>

  <div class="divider">أو</div>

  <div class="actions">

    <button type="button" class="btn-ghost" onclick="routeAction('inquiry')" aria-label="استعلام عن كرت">
      <span class="sym">&#9906;</span>
      <span>استعلام عن كرت</span>
    </button>

    <button type="button" class="btn-ghost" onclick="routeAction('salafni')" aria-label="خدمة سلفني">
      <span class="sym">&#9737;</span>
      <span>سلفني</span>
    </button>

    <button type="button" class="btn-ghost" onclick="routeAction('app')" aria-label="تحميل التطبيق">
      <span class="sym">&#8681;</span>
      <span>تحميل التطبيق</span>
    </button>

    <button type="button" class="btn-ghost" onclick="routeAction('help')" aria-label="مساعدة">
      <span class="sym">&#63;</span>
      <span>مساعدة</span>
    </button>

  </div>

  <div class="dev-sign">
    تصميم وتطوير: <span>حسين العولقي</span>
    <span class="sep">|</span>
    هاتف: <span>738660998</span>
  </div>

</main>

<script>
(function(){
  'use strict';

  /* ============================================================
     توجيه ديناميكي داخلي — يمنع كشف المسارات الحقيقية
     ============================================================ */
  var ROUTES = {
    login:   '/login',
    inquiry: '/card-inquiry',
    salafni: '/salafni',
    app:     '/app-download',
    help:    '/help'
  };

  /* استخراج المسار الحقيقي من خريطة داخلية بدل كتابته في HTML */
  function resolveRoute(key){
    return ROUTES[key] || ROUTES.login;
  }

  /* توجيه داخلي عبر location.replace لمنع بقاء المسار في الـ history */
  window.routeAction = function(key){
    var target = resolveRoute(key);
    try {
      window.location.replace(target);
    } catch(e) {
      window.location.href = target;
    }
    return false;
  };

  /* ============================================================
     معالجة تسجيل الدخول (بدون كشف بيانات المستخدم في الرابط)
     ============================================================ */
  window.handleLogin = function(ev){
    ev.preventDefault();

    var user = document.getElementById('username').value.trim();
    var pass = document.getElementById('password').value;
    var statusBox = document.getElementById('statusBox');

    statusBox.className = 'status';
    statusBox.textContent = '';

    if(!user){
      showStatus('error', 'الرجاء إدخال رقم الكرت');
      return false;
    }
    if(pass.length < 3){
      showStatus('error', 'كلمة المرور قصيرة جداً');
      return false;
    }

    /* منع هجمات التخمين البسيطة على مستوى العميل */
    var attempts = parseInt(sessionStorage.getItem('_at') || '0', 10);
    if(attempts >= 5){
      showStatus('error', 'تم تجاوز عدد المحاولات. أعد فتح الصفحة.');
      return false;
    }
    sessionStorage.setItem('_at', String(attempts + 1));

    /* إرسال البيانات بأمان عبر POST إلى /login */
    showStatus('ok', 'جارٍ التحقق...');

    var body = new URLSearchParams();
    body.append('username', user);
    body.append('password', pass);

    fetch(ROUTES.login, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    })
    .then(function(res){
      if(res.ok || res.redirected){
        sessionStorage.removeItem('_at');
        window.location.replace(res.url || '/status');
      } else if(res.status === 401){
        showStatus('error', 'بيانات الكرت غير صحيحة');
      } else {
        showStatus('error', 'تعذر الاتصال بالشبكة. حاول لاحقاً.');
      }
    })
    .catch(function(){
      /* في المعاينة المحلية داخل التطبيق، قد لا يوجد خادم */
      showStatus('ok', 'وضع المعاينة: تم استلام البيانات تجريبياً');
      console.log('[SANDBOX] login payload captured for local preview');
    });

    return false;
  };

  /* ============================================================
     عرض الحالة للمستخدم
     ============================================================ */
  function showStatus(type, msg){
    var box = document.getElementById('statusBox');
    box.className = 'status show ' + (type === 'error' ? 'error' : 'ok');
    box.textContent = msg;
  }

  /* ============================================================
     تحصين إضافي: منع Right-Click / DevTools البسيطة
     (اختياري — يمكن تعطيله إذا أزعج المستخدم)
     ============================================================ */
  document.addEventListener('contextmenu', function(e){
    e.preventDefault();
  }, {passive:false});

  /* تحقق من وجود الإعدادات المشتركة (theme.json) إن كانت متاحة */
  fetch('/templates/shared/theme.json', {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(cfg){
      if(!cfg) return;
      if(cfg.brand && cfg.brand.name){
        document.title = 'بوابة الدخول | ' + cfg.brand.name;
        var h1 = document.querySelector('.brand h1');
        if(h1) h1.textContent = cfg.brand.name;
      }
      if(cfg.features){
        if(cfg.features.salafni === false){
          var salafniBtn = document.querySelector('[onclick*="salafni"]');
          if(salafniBtn) salafniBtn.style.display = 'none';
        }
        if(cfg.features.cardInquiry === false){
          var inquiryBtn = document.querySelector('[onclick*="inquiry"]');
          if(inquiryBtn) inquiryBtn.style.display = 'none';
        }
        if(cfg.features.appDownload === false){
          var appBtn = document.querySelector('[onclick*="app"]');
          if(appBtn) appBtn.style.display = 'none';
        }
      }
    })
    .catch(function(){ /* تجاهل بصمت */ });

})();
</script>

</body>
</html>
