<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تحميل التطبيق</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0%,#0f172a,#020617 70%);color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:#0b1220;border:1px solid rgba(34,211,238,.4);border-radius:20px;padding:32px;text-align:center;box-shadow:0 0 40px rgba(34,211,238,.15)}
.icon{width:80px;height:80px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(135deg,#22d3ee,#0891b2);display:flex;align-items:center;justify-content:center;font-size:38px;color:#020617;font-weight:900;box-shadow:0 0 40px rgba(34,211,238,.4)}
h2{margin-bottom:10px;font-size:22px;text-shadow:0 0 15px #22d3ee}
p{color:#94a3b8;font-size:13px;margin-bottom:22px;line-height:1.7}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#0891b2);color:#020617;font-weight:800;cursor:pointer;font-size:15px;text-decoration:none;margin-bottom:10px}
.btn.ghost{background:transparent;border:1px solid rgba(34,211,238,.4);color:#22d3ee}
.dev{margin-top:22px;font-size:11px;color:#94a3b8;border-top:1px solid rgba(148,163,184,.12);padding-top:14px}
.dev span{color:#22d3ee;font-weight:600}
</style>
</head>
<body>
<div class="card">
<div class="icon">A</div>
<h2>تطبيق الشبكة</h2>
<p>حمّل التطبيق للوصول السريع للشبكة وإدارة الكروت من هاتفك.</p>
<a class="btn" href="https://github.com/alwaqyhsyn752-eng/mikrotik-hotspot-suite/releases/latest">تحميل APK</a>
<a class="btn ghost" href="https://github.com/alwaqyhsyn752-eng/mikrotik-hotspot-suite/actions">متابعة البناء</a>
<div class="dev">تصميم وتطوير: <span>حسين العولقي</span> | هاتف: <span>738660998</span></div>
</div>
</body>
</html>
