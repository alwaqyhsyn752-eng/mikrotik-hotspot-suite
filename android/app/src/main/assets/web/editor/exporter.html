<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><style>body{background:#020617;color:#fff;font-family:system-ui;padding:20px}textarea{width:100%;height:400px;background:#000;color:#0f0;font-family:monospace;border:1px solid #22d3ee;padding:10px;box-sizing:border-box;margin-bottom:10px}button{padding:10px 20px;background:#22d3ee;color:#000;border:none;border-radius:5px;font-weight:bold;cursor:pointer}a{color:#22d3ee;text-decoration:none;display:inline-block;margin-bottom:10px}</style></head><body><a href="../dashboard/index.html">← القائمة</a><h2>استخراج الكود</h2><select id="s" onchange="load()" style="padding:5px;margin-bottom:10px"><option>001</option><option>011</option><option>021</option><option>051</option><option>091</option></select><textarea id="o"></textarea><button onclick="copy()">نسخ الكود</button><script>function load(){fetch('../templates/tpl_'+document.getElementById('s').value+'.html').then(r=>r.text()).then(t=>document.getElementById('o').value=t)}function copy(){let t=document.getElementById('o');t.select();document.execCommand('copy');alert('تم النسخ')}load()</script></body></html>
