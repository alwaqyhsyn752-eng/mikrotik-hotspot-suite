<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><style>body{background:#020617;color:#fff;display:flex;flex-direction:column;height:100vh;margin:0;font-family:system-ui}.bar{padding:10px;background:#0b1220;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #22d3ee}.bar label{font-size:12px;color:#22d3ee}input,select{padding:5px;border-radius:5px;border:1px solid #334155;background:#000;color:#fff}iframe{flex:1;border:none;width:100%}</style></head><body><div class="bar"><label>القالب: <select id="tpl" onchange="document.getElementById('f').src='../templates/tpl_'+this.value+'.html'"><option value="001">001</option><option value="011">011</option><option value="021">021</option><option value="031">031</option><option value="041">041</option><option value="051">051</option><option value="061">061</option><option value="071">071</option><option value="081">081</option><option value="091">091</option></select></label><label>الشبكة: <input type="text" id="netName" value="شبكة المستقبل" oninput="apply()"></label><label>الهاتف: <input type="text" id="netPhone" value="738660998" oninput="apply()"></label><label>اللون: <input type="color" id="color" value="#22d3ee" oninput="apply()"></label></div><iframe id="f" src="../templates/tpl_001.html" onload="apply()"></iframe><script>function apply(){let iframe=document.getElementById("f");let doc=iframe.contentDocument||iframe.contentWindow.document;if(!doc)return;let name=document.getElementById("netName").value;let phone=document.getElementById("netPhone").value;let color=document.getElementById("color").value;let h1=doc.getElementById("netName");if(h1)h1.innerText=name;let sub=doc.getElementById("netPhone");if(sub)sub.innerHTML="هاتف: "+phone+" | <span id=clock></span>";let btn=doc.querySelector(".btn");if(btn)btn.style.background=color;let inputs=doc.querySelectorAll("input");inputs.forEach(i=>i.style.borderColor=color);let btns=doc.querySelectorAll(".features button");btns.forEach(b=>{b.style.borderColor=color;b.style.color=color});let css=doc.createElement("style");css.innerHTML=`h1,.sub{color:${color}!important}.card{border-color:${color}!important}`;doc.head.appendChild(css)}</script></body></html>
