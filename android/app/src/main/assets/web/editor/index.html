<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>المحرر البصري</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#020617;color:#e2e8f0;padding:20px;min-height:100vh}
h1{text-align:center;margin-bottom:20px;font-size:20px;text-shadow:0 0 15px #22d3ee}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:#0b1220;border:1px solid rgba(34,211,238,.3);border-radius:14px;padding:18px}
h2{font-size:13px;color:#22d3ee;margin:14px 0 10px;padding-bottom:8px;border-bottom:1px solid rgba(34,211,238,.2)}
label{display:block;font-size:11px;color:#94a3b8;margin:8px 0 4px}
input,select{width:100%;padding:8px;background:#020617;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-family:inherit;font-size:12px}
.feature{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(148,163,184,.1)}
.feature:last-child{border:none}
.feature span{font-size:12px}
.sw{position:relative;width:40px;height:22px}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;cursor:pointer;inset:0;background:#334155;border-radius:22px;transition:.25s}
.sl:before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s}
.sw input:checked+.sl{background:#22d3ee}
.sw input:checked+.sl:before{transform:translateX(18px)}
.btn{width:100%;padding:11px;margin-top:10px;border:none;border-radius:9px;background:linear-gradient(135deg,#22d3ee,#0891b2);color:#020617;font-weight:800;cursor:pointer;font-size:13px}
.btn.sec{background:transparent;border:1px solid rgba(34,211,238,.4);color:#22d3ee}
.preview{background:#0b1220;border:1px solid rgba(34,211,238,.3);border-radius:14px;overflow:hidden;min-height:600px}
.preview iframe{width:100%;height:600px;border:none}
.dev{text-align:center;font-size:10px;color:#94a3b8;margin-top:8px}
.dev span{color:#22d3ee}
</style>
</head>
<body>
<h1>المحرر البصري — بدون برمجة</h1>
<div class="wrap">
<div class="panel">
<h2>الهوية</h2>
<label>اسم الشبكة</label><input id="net" value="شبكة المستقبل">
<label>الهاتف</label><input id="ph" value="738660998">
<label>اللون الأساسي</label><input type="color" id="pr" value="#22d3ee">
<label>الخلفية</label><input type="color" id="bg" value="#020617">
<label>القالب</label>
<select id="tpl"><option value="login_01">قالب 01</option><option value="login_02">قالب 02</option><option value="login_03">قالب 03</option><option value="login_04">قالب 04</option><option value="login_05">قالب 05</option><option value="login_06">قالب 06</option><option value="login_07">قالب 07</option><option value="login_08">قالب 08</option><option value="login_09">قالب 09</option><option value="login_10">قالب 10</option><option value="login_11">قالب 11</option><option value="login_12">قالب 12</option><option value="login_13">قالب 13</option><option value="login_14">قالب 14</option><option value="login_15">قالب 15</option><option value="login_16">قالب 16</option><option value="login_17">قالب 17</option><option value="login_18">قالب 18</option><option value="login_19">قالب 19</option><option value="login_20">قالب 20</option></select>

<h2>الميزات</h2>
<div class="feature"><span>سلفني</span><label class="sw"><input type="checkbox" id="sf" checked><span class="sl"></span></label></div>
<div class="feature"><span>استعلام</span><label class="sw"><input type="checkbox" id="iq" checked><span class="sl"></span></label></div>
<div class="feature"><span>تحميل التطبيق</span><label class="sw"><input type="checkbox" id="ap" checked><span class="sl"></span></label></div>
<div class="feature"><span>QR على الكروت</span><label class="sw"><input type="checkbox" id="qr" checked><span class="sl"></span></label></div>

<button class="btn" onclick="apply()">تحديث المعاينة</button>
<button class="btn sec" onclick="dljson()">تنزيل theme.json</button>
<button class="btn sec" onclick="dlidx()">تنزيل index.html</button>
<div class="dev">تصميم وتطوير: <span>حسين العولقي</span> | هاتف: <span>738660998</span></div>
</div>
<div class="preview"><iframe id="frm"></iframe></div>
</div>
<script>
function cfg(){
  return {
    brand:{name:document.getElementById('net').value,primary:document.getElementById('pr').value,background:document.getElementById('bg').value},
    developer:{name:'حسين العولقي',phone:document.getElementById('ph').value},
    features:{salafni:document.getElementById('sf').checked,cardInquiry:document.getElementById('iq').checked,appDownload:document.getElementById('ap').checked,qrOnVoucher:document.getElementById('qr').checked},
    template:document.getElementById('tpl').value
  };
}
function apply(){
  var c=cfg(); var f=document.getElementById('frm');
  f.onload=function(){
    try{
      var d=f.contentDocument||f.contentWindow.document;
      d.documentElement.style.setProperty('--primary',c.brand.primary);
      d.documentElement.style.setProperty('--bg',c.brand.background);
      var h=d.querySelector('h1'); if(h&&c.brand.name)h.textContent=c.brand.name;
      var s=d.createElement('style');
      s.textContent='body{background:'+c.brand.background+' !important}h1{color:'+c.brand.primary+' !important}';
      d.head.appendChild(s);
    }catch(e){console.error(e);}
  };
  f.src='../templates/'+c.template+'/index.html';
}
function dljson(){
  var c=cfg();
  var b=new Blob([JSON.stringify(c,null,2)],{type:'application/json;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='theme.json'; a.click();
}
function dlidx(){
  var c=cfg();
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+c.brand.name+'</title>'+
    '<style>body{background:'+c.brand.background+';color:#e2e8f0;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}'+
    '.c{background:#0b1220;padding:32px;border-radius:20px;border:1px solid '+c.brand.primary+';max-width:400px;width:90%}'+
    'h1{color:'+c.brand.primary+';text-align:center}input{width:100%;padding:12px;margin-bottom:10px;background:#020617;border:1px solid #334155;border-radius:8px;color:#e2e8f0;box-sizing:border-box}'+
    'button{width:100%;padding:12px;border:none;border-radius:8px;background:'+c.brand.primary+';color:#020617;font-weight:800}'+
    '.s{text-align:center;font-size:10px;color:#94a3b8;margin-top:16px}</style></head>'+
    '<body><div class="c"><h1>'+c.brand.name+'</h1><input placeholder="رقم الكرت"><input type="password" placeholder="كلمة المرور">'+
    '<button>دخول</button><div class="s">تصميم وتطوير: حسين العولقي | هاتف: '+c.developer.phone+'</div></div></body></html>';
  var b=new Blob([html],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='index.html'; a.click();
}
apply();
</script>
</body>
</html>
