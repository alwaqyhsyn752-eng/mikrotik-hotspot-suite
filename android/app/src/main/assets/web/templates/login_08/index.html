<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قالب 08 | شبكة المستقبل</title>
<style>
:root{--primary:#c084fc;--secondary:#e9d5ff;--bg:#1a001a;--surf:#2d002d;--text:#f3e8ff;--accent:#d8b4fe}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;position:relative}
body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;z-index:0}
.card, .hero{position:relative;z-index:1}
h1{font-size:22px;font-weight:800;letter-spacing:.5px;margin:0 0 6px;text-shadow:0 0 20px var(--primary)}
.sub{font-size:13px;color:#94a3b8;margin:0 0 24px;text-align:center}
.logo3d{width:80px;height:80px;margin:0 auto 20px;perspective:600px}
.logo3d .inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:rotY 8s linear infinite}
.logo3d .face{position:absolute;inset:0;border:2px solid var(--primary);border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--secondary));box-shadow:0 0 30px var(--primary),inset 0 0 20px rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:var(--bg)}
@keyframes rotY{0%{transform:rotateY(0) rotateX(0)}50%{transform:rotateY(180deg) rotateX(10deg)}100%{transform:rotateY(360deg) rotateX(0)}}
.field{position:relative;margin-bottom:14px}
.field input{width:100%;padding:14px 16px;background:rgba(0,0,0,.5);border:1px solid rgba(148,163,184,.3);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:.3s}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,255,255,.05),0 0 25px var(--primary);transform:translateY(-2px)}
.field input::placeholder{color:#64748b}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#020617;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:6px;box-shadow:0 0 25px var(--primary),inset 0 1px 0 rgba(255,255,255,.3);transition:.2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.mini{padding:10px 6px;border:1px solid var(--primary);border-radius:10px;background:rgba(0,0,0,.3);color:var(--primary);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s;text-align:center}
.mini:hover{background:var(--primary);color:#020617;box-shadow:0 0 20px var(--primary)}
.mini .sym{font-size:16px;line-height:1}
.dev{margin-top:22px;text-align:center;font-size:11px;color:#94a3b8;border-top:1px solid rgba(148,163,184,.15);padding-top:14px;letter-spacing:.3px;line-height:1.7}
.dev span{color:var(--primary);font-weight:600}
.tilt{transition:transform .1s ease-out;transform-style:preserve-3d}

body{margin:0;min-height:100vh;background:var(--bg);position:relative;overflow:hidden}body::before{content:'';position:absolute;top:-50%;right:-30%;width:100%;height:150%;background:linear-gradient(135deg,var(--primary),transparent 60%);opacity:.15;transform:rotate(-15deg)}.card{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92%,420px);padding:36px 28px;border-radius:16px;background:var(--surf);border:1px solid var(--primary);box-shadow:0 0 50px rgba(0,0,0,.8),-8px -8px 0 0 var(--primary)}
body::after{content:'';position:fixed;top:50%;left:50%;width:800px;height:800px;margin:-400px 0 0 -400px;border:1px solid var(--primary);border-radius:50%;animation:spin 30s linear infinite;opacity:.15;pointer-events:none}body::before{content:'';position:fixed;top:50%;left:50%;width:500px;height:500px;margin:-250px 0 0 -250px;border:1px dashed var(--secondary);border-radius:50%;animation:spin 20s linear infinite reverse;opacity:.2;pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="hero">
  <div class="logo3d"><div class="inner"><div class="face">H</div></div></div>
  <h1>قالب 08</h1>
  <p class="sub">أدخل بيانات الكرت للاتصال</p>
</div>
<div class="card">
  <div class="logo3d" style="width:60px;height:60px;margin-bottom:16px"><div class="inner"><div class="face" style="font-size:26px">H</div></div></div>
  <h1 style="text-align:center">تسجيل الدخول</h1>
  <p class="sub">البوابة الآمنة للشبكة</p>
  <form autocomplete="off">
    <div class="field"><input type="text" name="username" placeholder="رقم الكرت" required maxlength="64"></div>
    <div class="field"><input type="password" name="password" placeholder="كلمة المرور" required maxlength="64"></div>
    <button type="submit" class="btn">دخول</button>
  </form>
  <div class="actions">
    <button class="mini" onclick="return goRoute('salafni')"><span class="sym">&#9737;</span>سلفني</button>
    <button class="mini" onclick="return goRoute('inquiry')"><span class="sym">&#9906;</span>استعلام</button>
    <button class="mini" onclick="return goRoute('app')"><span class="sym">&#8681;</span>تحميل</button>
  </div>
  <div class="dev">تصميم وتطوير: <span>حسين العولقي</span> | هاتف: <span>738660998</span></div>
</div>
<script>
(function(){
  'use strict';
  function initTilt(){
    var cards = document.querySelectorAll('.card, .hero');
    cards.forEach(function(c){
      c.classList.add('tilt');
      c.addEventListener('mousemove', function(e){
        var r = c.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width - 0.5;
        var y = (e.clientY - r.top) / r.height - 0.5;
        c.style.transform = 'perspective(1000px) rotateY(' + (x * 10) + 'deg) rotateX(' + (-y * 10) + 'deg)';
      });
      c.addEventListener('mouseleave', function(){ c.style.transform = ''; });
    });
  }
  function formHandler(){
    var forms = document.querySelectorAll('form');
    forms.forEach(function(f){
      f.addEventListener('submit', function(e){
        e.preventDefault();
        var u = f.querySelector('input[name=username]');
        var p = f.querySelector('input[name=password]');
        if(!u || !p){ return; }
        if(!u.value.trim()){ alert('أدخل رقم الكرت'); return; }
        if(p.value.length < 3){ alert('كلمة المرور قصيرة'); return; }
        var ok = document.createElement('div');
        ok.textContent = 'جارٍ التحقق...';
        ok.style.cssText = 'margin-top:12px;padding:10px;border-radius:8px;text-align:center;font-size:13px;background:rgba(34,211,238,.15);color:#22d3ee;border:1px solid #22d3ee';
        f.appendChild(ok);
        setTimeout(function(){ ok.textContent = 'وضع المعاينة: تم استلام البيانات'; }, 800);
      });
    });
  }
  function routes(){
    window.goRoute = function(name){
      var map = { inquiry:'/card-inquiry', salafni:'/salafni', app:'/app-download', help:'/help' };
      try { window.location.replace(map[name] || '/'); } catch(e) { window.location.href = map[name] || '/'; }
      return false;
    };
  }
  window.addEventListener('DOMContentLoaded', function(){ initTilt(); formHandler(); routes(); });
})();
</script>
</body>
</html>
