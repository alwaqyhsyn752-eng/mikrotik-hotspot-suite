<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قالب 10 | شبكة المستقبل</title>
<style>
:root{--p:#38bdf8;--bg:#031a2e;--card:#0c2d4a;--text:#e2e8f0;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;color:var(--text);min-height:100vh}
.card{box-sizing:border-box}
.card h1{color:var(--text)}
input{width:100%;padding:13px 16px;background:rgba(0,0,0,.4);border:1px solid rgba(148,163,184,.25);border-radius:11px;color:var(--text);font-size:14px;font-family:inherit;margin-bottom:11px;outline:none}
input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
input::placeholder{color:#64748b}
button{width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--p),#0891b2);color:#020617;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;margin-top:6px}
button:hover{filter:brightness(1.1)}
.sign{margin-top:20px;text-align:center;font-size:11px;color:var(--muted);border-top:1px solid rgba(148,163,184,.12);padding-top:14px}
.sign span{color:var(--p);font-weight:600}
body{background:var(--bg);min-height:100vh;padding:0;margin:0;display:flex;flex-direction:column}.card{width:100%;min-height:100vh;padding:60px 24px;display:flex;flex-direction:column;justify-content:center;border:none;border-radius:0;max-width:480px;margin:0 auto}.card h1{font-size:28px;margin:0 0 8px;font-weight:300;letter-spacing:2px}.card h1 span{color:var(--p);font-weight:800}.card .sub{color:#94a3b8;font-size:12px;margin-bottom:32px}
</style>
</head>
<body>
<div class="card">
  <h1>قالب 10</h1>
  <p class="sub">أدخل بيانات الكرت للاتصال</p>
  <form action="/login" method="post" autocomplete="off">
    <input type="text" name="username" placeholder="رقم الكرت" required maxlength="64">
    <input type="password" name="password" placeholder="كلمة المرور" required maxlength="64">
    <button type="submit">دخول</button>
  </form>
  <div class="sign">تصميم وتطوير: <span>حسين العولقي</span> | هاتف: <span>738660998</span></div>
</div>
</body>
</html>
