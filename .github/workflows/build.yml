name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept licenses and install SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "SDK ready"

      - name: Copy web assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r web/. android/app/src/main/assets/web/ || echo "WARN: web empty"
          ls android/app/src/main/assets/web/ | head

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tail -60

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-suite-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Hotspot Suite v${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
