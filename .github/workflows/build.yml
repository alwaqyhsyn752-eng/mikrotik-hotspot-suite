name: Build
on: [push, workflow_dispatch]
permissions: {contents: write}
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: "17"}
    - uses: android-actions/setup-android@v4
    - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
    - uses: gradle/actions/setup-gradle@v3
      with: {gradle-version: "8.2"}
    - run: mkdir -p android/app/src/main/assets/web && cp -r web/. android/app/src/main/assets/web/
    - run: cd android && gradle assembleDebug --no-daemon
    - uses: actions/upload-artifact@v4
      with: {name: apk, path: android/app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error}
    - uses: softprops/action-gh-release@v2
      if: success()
      with: {tag_name: "v${{ github.run_number }}", files: android/app/build/outputs/apk/debug/app-debug.apk}